datasource:
  type: PostgreSQL

datamaster:
  ontology:
    workflow:
      worker-enabled: ${WORKFLOW_WORKER_ENABLED:true}
      worker-delay-ms: ${WORKFLOW_WORKER_DELAY_MS:1000}
      worker-batch-size: ${WORKFLOW_WORKER_BATCH_SIZE:10}
      worker-stale-timeout-ms: ${WORKFLOW_WORKER_STALE_TIMEOUT_MS:300000}
    webhook:
      allowed-hosts: ${WEBHOOK_ALLOWED_HOSTS:}
      allowed-ports: ${WEBHOOK_ALLOWED_PORTS:80,443}
  # 数据接收子工程（消费 Kafka -> 冲突检查 -> 写入数仓 Doris）
  # 生产默认关闭；上线时通过环境变量填 Kafka / Doris 数据源后开启。
  ingestion:
    enabled: ${INGESTION_ENABLED:false}
    kafka:
      bootstrap-servers: ${INGESTION_KAFKA_SERVERS:localhost:9092}
      group-id: datamaster-ingestion
      topics: ${INGESTION_KAFKA_TOPICS:[]}
      poll-timeout-ms: 1000
      poll-interval-ms: 1000
      max-retries: ${INGESTION_KAFKA_MAX_RETRIES:3}
      retry-backoff-ms: ${INGESTION_KAFKA_RETRY_BACKOFF_MS:2000}
      dead-letter-topic: ${INGESTION_KAFKA_DEAD_LETTER_TOPIC:}
      event-lease-ms: ${INGESTION_KAFKA_EVENT_LEASE_MS:300000}
      lease-renew-interval-ms: ${INGESTION_KAFKA_LEASE_RENEW_INTERVAL_MS:60000}
    doris-datasource-id: ${INGESTION_DORIS_DATASOURCE_ID:0}
    conflict-strategy: ${INGESTION_CONFLICT_STRATEGY:UPSERT}
    key-columns: ${INGESTION_KEY_COLUMNS:[]}
    target-table: ${INGESTION_TARGET_TABLE:}
    allowed-tables: ${INGESTION_ALLOWED_TABLES:[]}
    required-columns: ${INGESTION_REQUIRED_COLUMNS:[]}
    schema-version: ${INGESTION_SCHEMA_VERSION:}
    decision-trigger:
      enabled: false
      base-url: ${INGESTION_DECISION_BASE_URL:}
      path: /ont/action/trigger/data-arrival

spring:
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    password:
    timeout: 10s
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 8
        max-wait: -1ms
  datasource:
    druid:
      stat-view-servlet:
        enabled: false
        loginUsername: DATAMASTER
        loginPassword: 123456
    dynamic:
      druid:
        initial-size: 5
        min-idle: 5
        maxActive: 20
        maxWait: 60000
        connectTimeout: 30000
        socketTimeout: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        filters: stat,slf4j
        connectionProperties: druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=5000
      datasource:
        master:
          driver-class-name: ${${datasource.type}.driver-class-name}
          url: ${${datasource.type}.url}
          username: ${${datasource.type}.username}
          password: ${${datasource.type}.password}

PostgreSQL:
  driver-class-name: org.postgresql.Driver
  url: jdbc:postgresql://postgresql:5432/DATAMASTER?stringtype=unspecified
  username: DATAMASTER
  password: DATAMASTER

dm8:
  driver-class-name: dm.jdbc.driver.DmDriver
  url: jdbc:dm://127.0.0.1:5236/DATAMASTER?STU&zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=utf-8&schema=DATAMASTER&serverTimezone=Asia/Shanghai
  username: DATAMASTER
  password: 密码

kingbase8:
  driver-class-name: com.kingbase8.Driver
  url: jdbc:kingbase8://127.0.0.1:54321/DATAMASTER_dev?characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC&currentSchema=DATAMASTER
  username: kingbase
  password: 123456

oracle:
  driver-class-name: oracle.jdbc.OracleDriver
  url: jdbc:oracle:thin:@127.0.0.1:1521:xe?oracle.jdbc.timezoneAsRegion=true&oracle.jdbc.defaultTimezone=Asia/Shanghai&currentSchema=ANIVIA
  username: ANIVIA
  password: ANIVIA

