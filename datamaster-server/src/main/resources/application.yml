datamaster:
  name: datamaster
  version: 3.8.8
  copyrightYear: 2024
  profile: ${user.dir}/upload/
  addressEnabled: false
  captchaType: math
  # 文件存储类型：local=本地存储，s3=S3协议兼容存储
  storage:
    type: ${STORAGE_TYPE:local}
  governance:
    table-access:
      enabled: ${TABLE_GOVERNANCE_ENABLED:false}
      mode: ${TABLE_GOVERNANCE_MODE:off}
      fallback-to-catalog: ${TABLE_GOVERNANCE_FALLBACK_TO_CATALOG:true}
  # 数据血缘开关：LINEAGE_ENABLED=true 时启用 Neo4j 血缘装配（需配置 spring.data.neo4j.*）
  # 默认关闭，未安装/未配置 Neo4j 时不影响 ETL 任务与动作执行
  lineage:
    enabled: ${LINEAGE_ENABLED:false}

server:
  port: 8989
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

logging:
  level:
    com.datamaster: debug
    org.springframework: warn

user:
  password:
    maxRetryCount: 5
    lockTime: 10
    universalPassword: gfh78h23789#$gfdy845

spring:
  cache:
    type: jcache
    jcache:
      config: classpath:ehcache.xml
  thymeleaf:
    prefix: classpath:/dist/
    mode: HTML
    encoding: utf-8
    cache: false
  messages:
    basename: i18n/messages
  profiles:
    active: dev
  config:
    import:
      - "application-${spring.profiles.active}.yml"
      - "classpath:application-auth-${spring.profiles.active}.yml"
      - "classpath:application-file-${spring.profiles.active}.yml"
      - "classpath:application-system-${spring.profiles.active}.yml"
      - "classpath:application-mc-${spring.profiles.active}.yml"
  servlet:
    multipart:
      max-file-size: 3000MB
      max-request-size: 3000MB
  devtools:
    restart:
      enabled: false

token:
  header: Authorization
  rpHeader: token
  secret: abcdefghijklmnopqrstuvwxyz
  expireTime: 600

mybatis-plus:
  typeAliasesPackage: com.datamaster.**.dataobject,com.datamaster.**.dataobject.assetchild, com.datamaster.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml
  global-config:
    banner: false
    db-config:
      idType: AUTO
      logic-delete-field: delFlag
      logic-delete-value: "'1'"
      logic-not-delete-value: "'0'"
      insertStrategy: NOT_NULL
      updateStrategy: NOT_NULL
      where-strategy: NOT_NULL

mybatis-plus-join:
  banner: false
  sub-table-logic: true
  ms-cache: true
  table-alias: t
  logic-del-type: on

pagehelper:
  helperDialect: postgresql
  supportMethodsArguments: true
  params: count=countSql

xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'system'
      paths-to-match: '/**'
      packages-to-scan: com.datamaster.module.system.controller
    - group: 'example'
      paths-to-match: '/**'
      packages-to-scan: com.datamaster.module.example.controller
    - group: 'ai'
      paths-to-match: '/**'
      packages-to-scan: com.datamaster.module.ai.controller
    - group: 'dm'
      paths-to-match: '/**'
      packages-to-scan: com.datamaster.module.dm.controller

knife4j:
  enable: true
  documents:
    -
      group: 2.X版本
      name: 接口签名
      locations: classpath:sign/*
  setting:
    language: zh-CN
    enable-swagger-models: true
    enable-document-manage: true
    swagger-model-name: 实体类列表
    enable-version: false
    enable-reload-cache-parameter: false
    enable-after-script: true
    enable-filter-multipart-api-method-type: POST
    enable-filter-multipart-apis: false
    enable-request-cache: true
    enable-host: false
    enable-host-text: 127.0.0.1:8989
    enable-home-custom: true
    home-custom-path: classpath:markdown/home.md
    enable-search: false
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: Apache License 2.0
    enable-dynamic-parameter: false
    enable-debug: true
    enable-open-api: true
    enable-group: true
  cors: false
  production: false
  basic:
    enable: true
    username: test
    password: 12313

flyflow:
  url: http://127.0.0.1:26859/

db-gpt:
  url: ${DB_GPT_URL:http://localhost:5670}
  timeout: ${DB_GPT_TIMEOUT:60000}
  model: ${DB_GPT_MODEL:qwen-plus}
  chat-mode: ${DB_GPT_CHAT_MODE:chat_with_db_qa}
  skill-space-name: ${DB_GPT_SKILL_SPACE_NAME:datamaster-skills}
  skill-space-owner: ${DB_GPT_SKILL_SPACE_OWNER:datamaster}

ai:
  skill-model:
    enabled: ${AI_SKILL_MODEL_ENABLED:false}
    api-url: ${AI_SKILL_MODEL_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    api-key: ${AI_SKILL_MODEL_API_KEY:sk-3d13e28f0c9c44628181045e454b75f8}
    model: ${AI_SKILL_MODEL_NAME:qwen-plus}
    timeout: ${AI_SKILL_MODEL_TIMEOUT:180000}
    retry-count: ${AI_SKILL_MODEL_RETRY_COUNT:2}
    retry-interval: ${AI_SKILL_MODEL_RETRY_INTERVAL:1500}
    temperature: ${AI_SKILL_MODEL_TEMPERATURE:0.2}
    max-tokens: ${AI_SKILL_MODEL_MAX_TOKENS:8192}

id.workerId: 1
id.datacenterId: 1

file:
  job:
    log:
      qualitytask_prefix_url: /opt/quality/logs
