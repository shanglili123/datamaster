datamaster:
  name: datamaster
  governance:
    table-access:
      enabled: ${TABLE_GOVERNANCE_ENABLED:false}
      mode: ${TABLE_GOVERNANCE_MODE:off}
      fallback-to-catalog: ${TABLE_GOVERNANCE_FALLBACK_TO_CATALOG:true}
  # 旧 Neo4j 对象/动作血缘保持独立，不作为新数据血缘的查询回退。
  lineage:
    enabled: ${LINEAGE_ENABLED:false}
    # 先执行 update_20261020_data_lineage.sql，再显式启用 PostgreSQL 数据血缘。
    jdbc-enabled: ${LINEAGE_JDBC_ENABLED:false}
    sync-delay-ms: ${LINEAGE_SYNC_DELAY_MS:5000}
  ontology:
    workflow:
      worker-enabled: ${WORKFLOW_WORKER_ENABLED:true}
      worker-delay-ms: ${WORKFLOW_WORKER_DELAY_MS:1000}
      worker-batch-size: ${WORKFLOW_WORKER_BATCH_SIZE:10}
      worker-stale-timeout-ms: ${WORKFLOW_WORKER_STALE_TIMEOUT_MS:300000}
    webhook:
      # 生产环境建议设置为精确 host 或 *.example.com，空值仍会阻止内网/保留地址但允许公网 host。
      allowed-hosts: ${WEBHOOK_ALLOWED_HOSTS:}
      allowed-ports: ${WEBHOOK_ALLOWED_PORTS:80,443}

sys:
  address-enabled: false
  captcha-type: math

server:
  port: 8989
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

logging:
  level:
    com.datamaster: debug
    org.springframework: warn

user:
  password:
    maxRetryCount: 5
    lockTime: 10
    # Legacy universal-password login is disabled unless explicitly supplied by a private environment variable.
    universalPassword: ${DATAMASTER_UNIVERSAL_PASSWORD:}

spring:
  cache:
    type: jcache
    jcache:
      config: classpath:ehcache.xml
  thymeleaf:
    prefix: classpath:/dist/
    mode: HTML
    encoding: utf-8
    cache: false
  messages:
    basename: i18n/messages
  profiles:
    active: dev
  config:
    import:
      - "application-${spring.profiles.active}.yml"
      - "classpath:application-auth-${spring.profiles.active}.yml"
      - "classpath:application-file-${spring.profiles.active}.yml"
      - "classpath:application-system-${spring.profiles.active}.yml"
      - "classpath:application-mc-${spring.profiles.active}.yml"
  servlet:
    multipart:
      max-file-size: 3000MB
      max-request-size: 3000MB
  devtools:
    restart:
      enabled: false

token:
  header: Authorization
  rpHeader: token
  secret: ${DATAMASTER_JWT_SECRET:abcdefghijklmnopqrstuvwxyz}
  expireTime: 600

mybatis-plus:
  typeAliasesPackage: com.datamaster.**.dataobject,com.datamaster.**.dataobject.assetchild, com.datamaster.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml
  global-config:
    banner: false
    db-config:
      idType: AUTO
      logic-delete-field: delFlag
      logic-delete-value: "'1'"
      logic-not-delete-value: "'0'"
      insertStrategy: NOT_NULL
      updateStrategy: NOT_NULL
      where-strategy: NOT_NULL

mybatis-plus-join:
  banner: false
  sub-table-logic: true
  ms-cache: true
  table-alias: t
  logic-del-type: on

pagehelper:
  helperDialect: postgresql
  supportMethodsArguments: true
  params: count=countSql

xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'system'
      paths-to-match: '/**'
      packages-to-scan: com.datamaster.module.system.controller
    - group: 'example'
      paths-to-match: '/**'
      packages-to-scan: com.datamaster.module.example.controller
    - group: 'ai'
      paths-to-match: '/**'
      packages-to-scan: com.datamaster.module.ai.controller
    - group: 'dm'
      paths-to-match: '/**'
      packages-to-scan: com.datamaster.module.dm.controller

knife4j:
  enable: ${KNIFE4J_ENABLED:false}
  documents:
    -
      group: 2.X版本
      name: 接口签名
      locations: classpath:sign/*
  setting:
    language: zh-CN
    enable-swagger-models: true
    enable-document-manage: true
    swagger-model-name: 实体类列表
    enable-version: false
    enable-reload-cache-parameter: false
    enable-after-script: true
    enable-filter-multipart-api-method-type: POST
    enable-filter-multipart-apis: false
    enable-request-cache: true
    enable-host: false
    enable-host-text: 127.0.0.1:8989
    enable-home-custom: true
    home-custom-path: classpath:markdown/home.md
    enable-search: false
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: Apache License 2.0
    enable-dynamic-parameter: false
    enable-debug: ${KNIFE4J_DEBUG:false}
    enable-open-api: true
    enable-group: true
  cors: false
  production: ${KNIFE4J_PRODUCTION:true}
  basic:
    enable: ${KNIFE4J_BASIC_ENABLED:false}
    username: test
    password: 12313

file:
  storage:
    type: ${STORAGE_TYPE:local}
    root-path: ${user.dir}/upload/
  job:
    log:
      qualitytask_prefix_url: /opt/quality/logs
