<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- 圆形背景 -->
  <circle cx="50" cy="50" r="50" fill="url(#bgGrad)"/>

  <!-- 抽象人物头部 -->
  <circle cx="50" cy="38" r="16" fill="#E0E7FF" opacity="0.9"/>

  <!-- 抽象人物身体 - 倒梯形 -->
  <path d="M32,56 Q50,52 68,56 L64,80 Q50,84 36,80 Z" fill="#E0E7FF" opacity="0.85"/>

  <!-- 数据流 - 从左到右穿过身体的弧线 -->
  <path d="M30,62 Q40,58 50,62 Q60,66 70,62" stroke="#7C3AED" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M30,69 Q40,65 50,69 Q60,73 70,69" stroke="#7C3AED" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M30,76 Q40,72 50,76 Q60,80 70,76" stroke="#7C3AED" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- 数据节点 - 流动的小圆点 -->
  <circle cx="38" cy="62" r="2" fill="#FCD34D"/>
  <circle cx="50" cy="66" r="2" fill="#FCD34D"/>
  <circle cx="62" cy="62" r="2" fill="#FCD34D"/>

  <circle cx="42" cy="69" r="1.8" fill="#FCD34D" opacity="0.8"/>
  <circle cx="58" cy="73" r="1.8" fill="#FCD34D" opacity="0.8"/>

  <!-- 头部数据环 - 像数据围绕头部 -->
  <circle cx="50" cy="38" r="20" stroke="#60A5FA" stroke-width="1.5" fill="none" opacity="0.4"/>
  <circle cx="50" cy="38" r="24" stroke="#60A5FA" stroke-width="1" fill="none" opacity="0.2" stroke-dasharray="3,3"/>

  <!-- 头部两侧的小数据点 -->
  <circle cx="30" cy="38" r="2.5" fill="#60A5FA" opacity="0.5"/>
  <circle cx="70" cy="38" r="2.5" fill="#60A5FA" opacity="0.5"/>

  <!-- 左眼 - 简约科技感 -->
  <circle cx="44" cy="36" r="3.5" fill="#1E293B"/>
  <circle cx="44" cy="35" r="1.2" fill="#E0E7FF"/>

  <!-- 右眼 -->
  <circle cx="56" cy="36" r="3.5" fill="#1E293B"/>
  <circle cx="56" cy="35" r="1.2" fill="#E0E7FF"/>

  <!-- 底部平台/数据底座 -->
  <rect x="28" y="86" width="44" height="4" rx="2" fill="#60A5FA" opacity="0.3"/>
  <rect x="32" y="82" width="36" height="4" rx="2" fill="#60A5FA" opacity="0.15"/>

  <!-- 右下角小装饰 - 数据块 -->
  <rect x="78" y="78" width="6" height="6" rx="1" fill="#A78BFA" opacity="0.3"/>
  <rect x="86" y="74" width="4" height="4" rx="1" fill="#A78BFA" opacity="0.2"/>
</svg>
